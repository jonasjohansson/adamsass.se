bio:
  - >-
    Adam Sass leads [People In Orbit](https://peopleinorbit.se/), an
    electroacoustic jazz group he writes for and directs. Their second album
    *Viewpoint* came out on April Records in 2026, after *Close/Away* in 2023.
  - >-
    He co-writes in [floats](https://floatsmusik.bandcamp.com/), a seven-piece
    from Sweden and Norway that has made everything as a group since 2017, and
    plays with [BEQ](https://linktr.ee/beq.band), Vidar Orchestra and
    Spontaneity Quartet. He has recorded with Isildurs Bane, Duppy Tales and
    You Thant. Alongside the bands he writes for larger ensembles: *Is There A
    Garden In My Head?* for big band, *Sunrise, Meeting, Remembrance* for string
    quartet and jazz ensemble, and music for the film series *Framtidens
    Historia*.
  - >-
    He studied at the Malmö Academy of Music with Tomasz Dąbrowski, Peter
    Asplund and Bobo Stenson. In 2025 he took second prize in Blåsmusikpriset
    Jazz and played 82 concerts in Sweden, Denmark, the Faroe Islands, Iceland
    and Germany. His work has been supported by Stim, Kungliga Musikaliska
    Akademien, Malmö Stad and Sten K Johnsons Stiftelse.
quote:
  text: An impressive achievement which bodes well for the future of this potent outfit.
  source: Jazz Journal on *Viewpoint*
