name: Build

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'assets/img/covers/src/**'
      - 'lib/**'
      - 'build.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Runs before the build on purpose: if Adam's content is invalid the job
      # fails here, nothing is pushed, and the previous page keeps serving.
      - run: npm test

      - name: Build and publish the page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A save landing while this runs leaves the push behind the remote.
          # Do not assume another run will clean up: two saves seconds apart
          # produced one run on 1 Sep 2026, its push was rejected, and the
          # rebuilt page was silently dropped while the Action reported success.
          # Recover here instead. Rebasing alone would publish a page built from
          # stale content, so rebuild from whatever content is newest and retry.
          for attempt in 1 2 3; do
            npm run build

            git add index.html assets/img/covers
            if git diff --staged --quiet; then
              echo "Nothing changed."
              exit 0
            fi

            git commit -m "Build the site"
            if git push; then
              echo "Published."
              exit 0
            fi

            echo "Push rejected on attempt $attempt: newer content landed. Rebuilding on it."
            git reset --hard HEAD~1
            git fetch origin main
            git reset --hard origin/main
          done

          echo "Could not publish after 3 attempts. The previous page is still serving."
          exit 1
