name: Build

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'assets/img/covers/src/**'
      - 'lib/**'
      - 'build.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Runs before the build on purpose: if Adam's content is invalid the job
      # fails here, nothing is pushed, and the previous page keeps serving.
      - run: npm test

      - run: npm run build

      - name: Commit the built page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/img/covers
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Build the site"
            # A second save landing mid-run leaves this push behind the remote.
            # The queued run rebuilds from the newer content and pushes that,
            # so being superseded is the system working, not a failure.
            git push || echo "Superseded by a newer content commit; the queued run will handle it."
          fi
